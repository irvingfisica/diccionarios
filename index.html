<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herramienta de diccionarios</title>
    
  </head>

  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-12" id="mainContent">
          <h1>Herramienta de diccionarios</h1>
          <p>Esta herramienta permite configurar diccionarios en la PNDA.</p>
          <div id="validacion"  class="mt-5">
            <h3>Validación</h3>
            <label for="apikey" class="form-label mt-2">Introduce tu APIkey:</label>
            <input type="text" class="form-control" id="apikey">
          </div>
          <div id="seleccion"  class="mt-5">
            <h3>Selección de recurso</h3>
            <div class="buscainst-wrapper mt-4">
              <label for="buscainst" class="form-label mt-2">Busca una institución para explorar sus conjuntos y recursos de datos:</label>
              <input type="text" id="buscainst" placeholder="Busca una institución..." autocomplete="off">
            </div>
            <div id="recursos" class="mt-4 mb-4"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>
    <script type="module" src="/src/main.js" defer></script>
  </body>
</html>
